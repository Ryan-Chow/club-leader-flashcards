<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Club Leader Flashcards</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --text: #1c1f2a;
    --muted: #6b7083;
    --border: #e3e5ee;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --good: #15803d;
    --good-soft: #e7f6ec;
    --bad: #b91c1c;
    --bad-soft: #fdecec;
    --shadow: 0 6px 24px rgba(20, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141b;
      --surface: #1c1f29;
      --text: #eceef5;
      --muted: #9aa0b4;
      --border: #2c3040;
      --accent: #8b85ff;
      --accent-soft: #262a45;
      --good: #4ade80;
      --good-soft: #17301f;
      --bad: #f87171;
      --bad-soft: #3a1c1c;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
  header h1 { font-size: 1.25rem; margin: 4px 0 12px; }
  header h1 span { color: var(--accent); }

  nav.tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; margin-bottom: 16px;
  }
  nav.tabs button {
    border: 0; background: transparent; color: var(--muted);
    padding: 9px 4px; border-radius: 9px; font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  nav.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .progress { font-size: .9rem; color: var(--muted); }
  .progress b { color: var(--text); }
  .meter { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .meter > div { height: 100%; background: var(--good); width: 0; transition: width .3s; }

  button.btn {
    font: inherit; font-weight: 600; font-size: .92rem;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 10px 14px; border-radius: 10px; cursor: pointer; min-height: 44px;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn.small { padding: 6px 10px; min-height: 34px; font-size: .84rem; }
  button.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  button.btn.bad  { background: var(--bad-soft);  border-color: transparent; color: var(--bad); }
  button.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }

  /* Flip card */
  .scene { perspective: 1200px; margin-bottom: 14px; }
  .card {
    position: relative; min-height: 340px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.3,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 22px; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .face.back { transform: rotateY(180deg); }
  .face.center { align-items: center; justify-content: center; text-align: center; }
  .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: .78rem; color: var(--muted); }
  .bignames { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -.01em; }
  .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-top: 10px; }
  .label:first-child { margin-top: 0; }
  .value { font-weight: 600; }
  .name-sm { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
  ul.exp { margin: 4px 0 24px; padding-left: 18px; }
  ul.exp li { margin: 3px 0; }
  .pill {
    display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent);
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls.nav { grid-template-columns: 1fr 1fr 1fr; margin-top: 8px; }

  /* Quiz */
  .quizcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 14px;
  }
  .prompt { font-size: 1.2rem; font-weight: 700; margin: 6px 0 4px; }
  .choices { display: grid; gap: 8px; }
  .choices button { text-align: left; }
  .choices button.right { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .choices button.wrong { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .choices button:disabled { cursor: default; }
  .choices kbd, .kbd {
    font: 600 .72rem ui-monospace, Menlo, monospace; color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; margin-right: 8px;
  }
  .feedback { min-height: 1.5em; margin: 12px 0 0; font-weight: 600; }
  .feedback.right { color: var(--good); }
  .feedback.wrong { color: var(--bad); }

  /* Study */
  .study { display: grid; gap: 12px; }
  .person {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
  }
  .person h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .person .meta { color: var(--muted); font-size: .92rem; margin-bottom: 6px; }
  .person ul { margin: 6px 0 0; padding-left: 18px; }
  input.search {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); margin-bottom: 12px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-weight: 600; font-size: .9rem; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .shortcuts { margin-top: 18px; font-size: .8rem; color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 420px) {
    .card { min-height: 380px; }
    nav.tabs button { font-size: .8rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Club Leader <span>Flashcards</span></h1></header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="flash">Flashcards</button>
    <button role="tab" data-mode="reverse">Reverse</button>
    <button role="tab" data-mode="quiz">Quiz</button>
    <button role="tab" data-mode="study">Study</button>
  </nav>

  <!-- Flashcards + Reverse share this view -->
  <section id="deckView" hidden>
    <div class="bar">
      <div class="progress" id="deckProgress"></div>
      <div>
        <button class="btn small" id="shuffleBtn">Shuffle</button>
        <button class="btn small" id="resetBtn">Reset</button>
      </div>
    </div>
    <div class="meter"><div id="deckMeter"></div></div>

    <div class="scene">
      <div class="card" id="card" tabindex="0" aria-live="polite">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn bad" id="missBtn">✗ Missed it</button>
      <button class="btn good" id="gotBtn">✓ Got it</button>
    </div>
    <div class="controls nav">
      <button class="btn" id="prevBtn">← Prev</button>
      <button class="btn primary" id="flipBtn">Flip</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
    <div class="shortcuts"><span class="kbd">Space</span>flip · <span class="kbd">←</span><span class="kbd">→</span>navigate · <span class="kbd">G</span>got it · <span class="kbd">M</span>missed it</div>
  </section>

  <!-- Quiz -->
  <section id="quizView" hidden>
    <div class="bar">
      <div class="progress" id="quizScore"></div>
      <button class="btn small" id="quizResetBtn">Reset score</button>
    </div>
    <div class="quizcard">
      <div class="label">Who had this experience?</div>
      <div class="prompt" id="quizPrompt"></div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
    <div class="choices" id="quizChoices"></div>
    <div class="controls" style="grid-template-columns:1fr; margin-top:10px">
      <button class="btn primary" id="quizNextBtn">Next question →</button>
    </div>
    <div class="shortcuts"><span class="kbd">1</span>–<span class="kbd">5</span>answer · <span class="kbd">→</span>/<span class="kbd">Enter</span>next question</div>
  </section>

  <!-- Study list -->
  <section id="studyView" hidden>
    <input class="search" id="search" type="search" placeholder="Filter by name, major, company…" autocomplete="off">
    <div class="study" id="studyList"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const PEOPLE = [
  {
    name: "Leo Li",
    major: "Business Economics",
    affiliation: "Delta Sigma Pi (Omicron Sigma Chapter)",
    experiences: [
      "Legal Intern at General Atomics",
      "President at Delta Sigma Pi",
      "Customs and International Trade Consulting Intern at BDO USA",
      "Procurement Intern at Axos Bank",
      "Strategy & Business Operations Intern at HelloFresh"
    ]
  },
  {
    name: "Nevin Pepper",
    major: "Business/Managerial Economics",
    affiliation: "Delta Sigma Pi & The Delta Chi Fraternity, Inc.",
    experiences: [
      "ITS Consultant at UC Riverside",
      "Social Chair at Delta Chi",
      "Vice President at Delta Chi",
      "Electronic Sourcing Intern at ASSA ABLOY Group",
      "Vice President at Delta Sigma Pi",
      "Project Coordinator Intern at ASSA ABLOY Group"
    ]
  },
  {
    name: "Sophia Furnival",
    major: "BS in Human Computer Interaction",
    affiliation: "Product Space @ UC San Diego",
    experiences: [
      "Server / Sommelier at Hyatt",
      "Product & Market Research Intern at Learvo",
      "Private Wealth Management Intern at Merrill Lynch",
      "Business Analytics Intern at Merrill Lynch",
      "Product Marketing Fellow at Product Space",
      "External Development Chair, Executive Board at Product Space",
      "Product Management / Strategic Product Planning Co-Op at Volvo Group",
      "Product Researcher, Product Management Board at Product Space",
      "Strategy & Management Summer Analyst at Bank of America"
    ]
  },
  {
    name: "Sophie Mandal",
    major: "Cognitive Science (Design & HCI) with a Minor in Business",
    affiliation: "Triton Business Society",
    experiences: [
      "Intern for Congressman Mike Thompson at U.S. House of Representatives",
      "Assistant Preschool Teacher at Wishing Star Preschool",
      "Consultant at Lumnus Consulting",
      "Member at Triton Business Society",
      "Product Management & Customer Discovery Intern at Learvo Learning",
      "Design & Marketing Intern at UCSD Rady School of Management",
      "Vice President of Marketing at Triton Business Society",
      "Marketing Lead at Product Space",
      "Technical Product Management Intern at XiFin, Inc.",
      "Grammarly Ambassador at Grammarly"
    ]
  },
  {
    name: "Hanna Kwan",
    major: "U.S. History (minor in Political Science / Pre-Law)",
    affiliation: "Triton Business Society",
    experiences: [
      "Owner of sub non-profit at Dressember",
      "Server at Ko Juice",
      "Instructor at The First Tee Sports Summer Camp",
      "Salesperson at Tillys",
      "Co-Founder and President at Project Venus at UCSD",
      "Legal Intern (Part-time) at Shioda Langley & Chang, LLP",
      "Member at Triton Business Society",
      "Vice President of DEI at Triton Business Society",
      "Director of Online Outreach at Raymond Liu State Senate Campaign (CA SD 10)",
      "Legal Intern (Full-time) at Shioda Langley & Chang, LLP",
      "Student Involvement Leadership Consultant at UC San Diego"
    ]
  }
];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const sample = (arr, n) => shuffle(arr).slice(0, n);
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// Experiences shared by more than one person (e.g. "Member at Triton Business Society")
// are ambiguous, so the quiz and reverse cards skip them.
const expCount = {};
PEOPLE.forEach(p => p.experiences.forEach(e => { expCount[e] = (expCount[e] || 0) + 1; }));
const uniqueExps = p => p.experiences.filter(e => expCount[e] === 1);

// ---------- persistence ----------
const STORAGE_KEY = "clubLeaderFlashcards.v1";
const freshDeck = () => ({ order: shuffle(PEOPLE.map((_, i) => i)), pos: 0, known: {}, misses: {}, round: 1 });
const defaultState = () => ({ mode: "flash", decks: { flash: freshDeck(), reverse: freshDeck() }, quiz: { correct: 0, total: 0, streak: 0 } });

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    const validDeck = deck => deck && Array.isArray(deck.order) && deck.order.length &&
      deck.order.every(i => Number.isInteger(i) && i >= 0 && i < PEOPLE.length);
    return {
      mode: ["flash", "reverse", "quiz", "study"].includes(s.mode) ? s.mode : d.mode,
      decks: {
        flash: validDeck(s.decks && s.decks.flash) ? { ...d.decks.flash, ...s.decks.flash } : d.decks.flash,
        reverse: validDeck(s.decks && s.decks.reverse) ? { ...d.decks.reverse, ...s.decks.reverse } : d.decks.reverse
      },
      quiz: { ...d.quiz, ...(s.quiz || {}) }
    };
  } catch (e) {
    return defaultState();
  }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
let state = loadState();
if (state.decks.flash.pos >= state.decks.flash.order.length) state.decks.flash.pos = 0;
if (state.decks.reverse.pos >= state.decks.reverse.order.length) state.decks.reverse.pos = 0;

// ---------- mode switching ----------
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("deckView").hidden = !(mode === "flash" || mode === "reverse");
  $("quizView").hidden = mode !== "quiz";
  $("studyView").hidden = mode !== "study";
  if (mode === "flash" || mode === "reverse") renderCard();
  if (mode === "quiz") { if (!quiz) newQuestion(); else renderQuiz(); }
  if (mode === "study") renderStudy();
  saveState();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

// ---------- flashcards / reverse ----------
const deck = () => state.decks[state.mode];
let flipped = false;
let reverseExpCache = {}; // card position -> sampled experiences, so a card doesn't change while flipping

function renderCard() {
  const d = deck();
  const p = PEOPLE[d.order[d.pos]];
  flipped = false;
  $("card").classList.remove("flipped");

  const details = exps => `
    <div class="label">Major</div><div class="value">${esc(p.major)}</div>
    <div class="label">Affiliation</div><div class="value">${esc(p.affiliation)}</div>
    <div class="label">Experiences</div>
    <ul class="exp">${exps.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;

  const misses = d.misses[p.name] || 0;
  const tag = d.known[p.name] ? `<span class="pill">Known</span>` : misses ? `<span class="pill">Missed ×${misses}</span>` : "";

  if (state.mode === "flash") {
    $("front").className = "face front center";
    $("front").innerHTML = `${tag}<div class="bignames">${esc(p.name)}</div><div class="hint">Tap or press Space to flip</div>`;
    $("back").className = "face back";
    $("back").innerHTML = `<div class="name-sm">${esc(p.name)}</div>${details(p.experiences)}`;
  } else {
    const key = d.round + ":" + d.pos;
    if (!reverseExpCache[key]) {
      const pool = uniqueExps(p);
      reverseExpCache[key] = sample(pool, Math.min(pool.length, 2 + Math.floor(Math.random() * 2)));
    }
    $("front").className = "face front";
    $("front").innerHTML = `<div style="margin-bottom:8px">${tag}</div>${details(reverseExpCache[key])}<div class="hint">Who is this? Tap or press Space to flip</div>`;
    $("back").className = "face back center";
    $("back").innerHTML = `<div class="bignames">${esc(p.name)}</div>`;
  }
  renderDeckProgress();
}

function renderDeckProgress() {
  const d = deck();
  const known = PEOPLE.filter(p => d.known[p.name]).length;
  $("deckProgress").innerHTML = `Card <b>${d.pos + 1}</b> / ${d.order.length} · Known <b>${known}</b> / ${PEOPLE.length} · Round ${d.round}`;
  $("deckMeter").style.width = (known / PEOPLE.length * 100) + "%";
}

function flip() {
  flipped = !flipped;
  $("card").classList.toggle("flipped", flipped);
}

function newRound() {
  const d = deck();
  // Everyone once, plus an extra copy of anyone not yet known (two extra if missed 2+ times).
  let order = PEOPLE.map((_, i) => i);
  PEOPLE.forEach((p, i) => {
    if (!d.known[p.name]) {
      const extra = (d.misses[p.name] || 0) >= 2 ? 2 : (d.misses[p.name] ? 1 : 0);
      for (let k = 0; k < extra; k++) order.push(i);
    }
  });
  order = spreadOut(shuffle(order));
  d.order = order;
  d.pos = 0;
  d.round++;
  reverseExpCache = {};
  const known = PEOPLE.filter(p => d.known[p.name]).length;
  toast(known === PEOPLE.length ? "All 5 known! New round started." : `Round ${d.round} — missed cards appear more often`);
}

// Avoid the same person showing twice in a row where possible.
function spreadOut(order) {
  for (let i = 1; i < order.length; i++) {
    if (order[i] === order[i - 1]) {
      const j = order.findIndex((v, k) => k > i && v !== order[i] && v !== order[i - 1]);
      if (j > -1) [order[i], order[j]] = [order[j], order[i]];
    }
  }
  return order;
}

function next() {
  const d = deck();
  if (d.pos + 1 >= d.order.length) newRound();
  else d.pos++;
  saveState();
  renderCard();
}
function prev() {
  const d = deck();
  if (d.pos > 0) { d.pos--; saveState(); renderCard(); }
  else toast("This is the first card");
}

function gotIt() {
  const d = deck();
  const p = PEOPLE[d.order[d.pos]];
  d.known[p.name] = true;
  next();
}
function missedIt() {
  const d = deck();
  const idx = d.order[d.pos];
  const p = PEOPLE[idx];
  d.known[p.name] = false;
  d.misses[p.name] = (d.misses[p.name] || 0) + 1;
  // Bring this card back soon: re-insert it 2–4 cards ahead, unless it's already queued twice.
  const upcoming = d.order.slice(d.pos + 1).filter(i => i === idx).length;
  if (upcoming < 2) {
    const at = Math.min(d.order.length, d.pos + 3 + Math.floor(Math.random() * 2));
    d.order.splice(at, 0, idx);
  }
  next();
}

function shuffleDeck() {
  const d = deck();
  d.order = spreadOut(shuffle(d.order));
  d.pos = 0;
  reverseExpCache = {};
  saveState();
  renderCard();
  toast("Shuffled");
}
function resetDeck() {
  if (!confirm("Reset progress for this mode?")) return;
  state.decks[state.mode] = freshDeck();
  reverseExpCache = {};
  saveState();
  renderCard();
  toast("Progress reset");
}

$("card").addEventListener("click", flip);
$("flipBtn").addEventListener("click", flip);
$("nextBtn").addEventListener("click", next);
$("prevBtn").addEventListener("click", prev);
$("gotBtn").addEventListener("click", gotIt);
$("missBtn").addEventListener("click", missedIt);
$("shuffleBtn").addEventListener("click", shuffleDeck);
$("resetBtn").addEventListener("click", resetDeck);

// ---------- quiz ----------
let quiz = null; // { exp, answer, choices, picked }

function newQuestion() {
  const person = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  const pool = uniqueExps(person);
  let exp = pool[Math.floor(Math.random() * pool.length)];
  if (quiz && quiz.exp === exp && pool.length > 1) exp = pool.find(e => e !== exp);
  quiz = { exp, answer: person.name, choices: shuffle(PEOPLE.map(p => p.name)), picked: null };
  renderQuiz();
}

function renderQuiz() {
  const q = state.quiz;
  const pct = q.total ? Math.round(q.correct / q.total * 100) : 0;
  $("quizScore").innerHTML = `Score <b>${q.correct}</b> / ${q.total}${q.total ? ` (${pct}%)` : ""} · Streak <b>${q.streak}</b>`;
  $("quizPrompt").textContent = quiz.exp;
  const fb = $("quizFeedback");
  if (quiz.picked == null) { fb.textContent = ""; fb.className = "feedback"; }
  else if (quiz.picked === quiz.answer) { fb.textContent = "✓ Correct!"; fb.className = "feedback right"; }
  else { fb.textContent = `✗ It was ${quiz.answer}`; fb.className = "feedback wrong"; }

  $("quizChoices").innerHTML = quiz.choices.map((n, i) => {
    let cls = "btn";
    if (quiz.picked != null) {
      if (n === quiz.answer) cls += " right";
      else if (n === quiz.picked) cls += " wrong";
    }
    return `<button class="${cls}" data-name="${esc(n)}" ${quiz.picked != null ? "disabled" : ""}><kbd>${i + 1}</kbd>${esc(n)}</button>`;
  }).join("");
  $("quizChoices").querySelectorAll("button").forEach(b => b.addEventListener("click", () => answer(b.dataset.name)));
}

function answer(name) {
  if (!quiz || quiz.picked != null) return;
  quiz.picked = name;
  state.quiz.total++;
  if (name === quiz.answer) { state.quiz.correct++; state.quiz.streak++; }
  else state.quiz.streak = 0;
  saveState();
  renderQuiz();
}

$("quizNextBtn").addEventListener("click", newQuestion);
$("quizResetBtn").addEventListener("click", () => {
  state.quiz = { correct: 0, total: 0, streak: 0 };
  saveState();
  renderQuiz();
  toast("Score reset");
});

// ---------- study list ----------
function renderStudy() {
  const q = $("search").value.trim().toLowerCase();
  const list = PEOPLE.filter(p => !q || [p.name, p.major, p.affiliation, ...p.experiences].join(" ").toLowerCase().includes(q));
  $("studyList").innerHTML = list.length ? list.map(p => `
    <article class="person">
      <h2>${esc(p.name)}</h2>
      <div class="meta">${esc(p.major)}<br>${esc(p.affiliation)}</div>
      <ul>${p.experiences.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    </article>`).join("") : `<p class="progress">No matches.</p>`;
}
$("search").addEventListener("input", renderStudy);

// ---------- keyboard ----------
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const m = state.mode;
  if (m === "flash" || m === "reverse") {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if (e.key === "g" || e.key === "G") gotIt();
    else if (e.key === "m" || e.key === "M") missedIt();
  } else if (m === "quiz") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= quiz.choices.length) answer(quiz.choices[n - 1]);
    else if (e.key === "ArrowRight" || e.key === "Enter" || e.key === " ") { e.preventDefault(); newQuestion(); }
  }
});

setMode(state.mode);
</script>
</body>
</html>
